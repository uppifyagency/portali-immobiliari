<title id="t">portali-immobiliari</title>
<desc id="d">Tredici portali immobiliari italiani confluiscono in una sola ricerca.</desc>
<defs>
  <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0d1526"/><stop offset="1" stop-color="#111c33"/>
  </linearGradient>
  <linearGradient id="filo" gradientUnits="userSpaceOnUse" x1="860" y1="0" x2="992" y2="0">
    <stop offset="0" stop-color="#3a4a6e"/><stop offset="1" stop-color="#f4a261"/>
  </linearGradient>
  <linearGradient id="casa" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffd08a"/><stop offset="1" stop-color="#ee7b4f"/>
  </linearGradient>
  <radialGradient id="alone" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#f4a261" stop-opacity="0.34"/><stop offset="1" stop-color="#f4a261" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="luce" cx="0.12" cy="0.1" r="0.7">
    <stop offset="0" stop-color="#3b5bdb" stop-opacity="0.20"/><stop offset="1" stop-color="#3b5bdb" stop-opacity="0"/>
  </radialGradient>
  <pattern id="punti" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.045"/>
  </pattern>
  <clipPath id="carta"><rect width="1200" height="560" rx="28"/></clipPath>
  <style>
    .flussi path { stroke-dasharray: 3 21; animation: scorri 2.4s linear infinite; }
    @keyframes scorri { to { stroke-dashoffset: -48; } }
    .alone { animation: respira 4.8s ease-in-out infinite; transform-origin: 1068px 280px; }
    @keyframes respira { 50% { transform: scale(1.12); opacity: .75; } }
    @media (prefers-reduced-motion: reduce) { .flussi path, .alone { animation: none; } }
  </style>
</defs>
<g clip-path="url(#carta)">
  <rect width="1200" height="560" fill="url(#fondo)"/>
  <rect width="1200" height="560" fill="url(#punti)"/>
  <rect width="1200" height="560" fill="url(#luce)"/>
</g>
